[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "temporalproof"
version = "0.1.0"
description = "Reproducible temporal retrieval research: dataset audit foundation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
temporalproof-audit = "temporalproof.data.audit:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
